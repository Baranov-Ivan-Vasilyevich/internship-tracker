<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- App icon: browser tab (ico + svg), iPhone home screen (apple-touch-icon), installable app (manifest) -->
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-title" content="IB Tracker" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Internship Tracker</title>
    <script>
      // Apply the saved theme before the page draws, so there is no white flash in dark mode
      try {
        const t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
